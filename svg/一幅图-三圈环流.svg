<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三圈环流板书">
            <defs>
              <marker id="aw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M1 1.6 L10.2 6 L1 10.4 Z" fill="#f4efe4"/>
              </marker>
              <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M1 1.6 L10.2 6 L1 10.4 Z" fill="#ffb3a2"/>
              </marker>
              <marker id="ab" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M1 1.6 L10.2 6 L1 10.4 Z" fill="#9ed4ff"/>
              </marker>
              <marker id="ag" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
                <path d="M1 1.6 L10.2 6 L1 10.4 Z" fill="#c6e7a0"/>
              </marker>
              <marker id="ay" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
                <path d="M1 1.6 L10.2 6 L1 10.4 Z" fill="#ffe08a"/>
              </marker>
              <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
                <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(244,239,228,.2)" stroke-width="1"/>
              </pattern>
              <style>
                text { font-family: KaiTi, STKaiti, "楷体", "Songti SC", "PingFang SC", sans-serif; }
                .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; }
              </style>
            </defs>

            <rect width="1280" height="740" fill="#165a42"/>
            <ellipse cx="280" cy="320" rx="160" ry="60" fill="rgba(255,255,255,.035)"/>
            <ellipse cx="560" cy="240" rx="110" ry="40" fill="rgba(255,255,255,.03)"/>

            <g id="g-title" data-step="0" opacity="1">
              <text x="36" y="46" fill="#ffe08a" font-size="32">一幅图搞懂三圈环流</text>
              <text x="348" y="46" fill="#f4efe4" font-size="26">· 高空西风</text>
              <text x="36" y="74" fill="rgba(244,239,228,.6)" font-size="15">北半球剖面　赤道在左　北极在右</text>
            </g>

            <g id="g-frame" data-step="0" opacity="1">
              <line class="draw" fill="none" data-draw="1" x1="70" y1="198" x2="800" y2="186" stroke="rgba(244,239,228,.38)" stroke-width="1.5" stroke-dasharray="2 7"/>
              <text x="16" y="196" fill="rgba(244,239,228,.72)" font-size="14">高空</text>
              <path class="draw" fill="none" data-draw="1" d="M60 500 C 220 514, 480 488, 800 506" stroke="#f4efe4" stroke-width="3"/>
              <path d="M60 512 C 220 526, 480 500, 800 518 L800 548 C480 532, 220 558, 60 544 Z" fill="url(#hatch)"/>
              <text x="16" y="518" fill="rgba(244,239,228,.72)" font-size="14">近地面</text>
              <g fill="rgba(244,239,228,.8)" font-size="15" text-anchor="middle">
                <line x1="110" y1="176" x2="110" y2="500" stroke="rgba(244,239,228,.2)" stroke-dasharray="3 6"/>
                <line x1="310" y1="176" x2="310" y2="500" stroke="rgba(244,239,228,.2)" stroke-dasharray="3 6"/>
                <line x1="530" y1="176" x2="530" y2="500" stroke="rgba(244,239,228,.2)" stroke-dasharray="3 6"/>
                <line x1="750" y1="176" x2="750" y2="500" stroke="rgba(244,239,228,.2)" stroke-dasharray="3 6"/>
                <text x="110" y="572">赤道 0°</text>
                <text x="310" y="572">30°N</text>
                <text x="530" y="572">60°N</text>
                <text x="750" y="572">北极 90°</text>
              </g>
              </g>

            <g id="g-heat" data-step="1" opacity="1">
              <circle cx="48" cy="340" r="11" fill="none" stroke="#ffd56b" stroke-width="1.8"/>
              <g stroke="#ffd56b" stroke-width="1.4">
                <line x1="48" y1="322" x2="48" y2="316"/>
                <line x1="48" y1="364" x2="48" y2="358"/>
                <line x1="30" y1="340" x2="36" y2="340"/>
                <line x1="66" y1="340" x2="60" y2="340"/>
              </g>
              <text x="28" y="386" fill="#ffd56b" font-size="13">受热</text>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ar)" marker-end="url(#ar)" d="M110 492 C96 410, 98 300, 118 214" stroke="#ffb3a2" stroke-width="3.4"/>
            </g>

            <g id="g-single" data-step="1" data-hide="2" display="none">
              <path class="draw" fill="none" data-draw="1" data-marker="url(#aw)" marker-end="url(#aw)" d="M124 208 C 280 156, 520 150, 734 204" stroke="#f4efe4" stroke-width="2.6" stroke-dasharray="7 6"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ab)" marker-end="url(#ab)" d="M742 214 C760 320, 762 420, 742 490" stroke="#9ed4ff" stroke-width="3.2"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#aw)" marker-end="url(#aw)" d="M732 512 C 500 548, 260 544, 120 504" stroke="rgba(244,239,228,.85)" stroke-width="2.5" stroke-dasharray="7 6"/>
              <text x="250" y="124" fill="#ffe08a" font-size="18">单圈环流 · 假设不自转</text>
            </g>

            <g id="g-hadley" data-step="2" opacity="1">
              <path class="draw" fill="none" data-draw="1" data-marker="url(#aw)" marker-end="url(#aw)" d="M126 210 C 190 184, 250 186, 296 214" stroke="#f4efe4" stroke-width="3.2"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ab)" marker-end="url(#ab)" d="M304 220 C322 310, 322 410, 304 490" stroke="#9ed4ff" stroke-width="3.4"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ar)" marker-end="url(#ar)" d="M296 510 C 230 526, 170 524, 118 500" stroke="#ffb3a2" stroke-width="3"/>
              <text x="140" y="160" fill="#ffe08a" font-size="14">高空右偏，堆成西风</text>
              <text x="145" y="448" fill="#ffb3a2" font-size="16">东北信风</text>
              <text x="86" y="468" fill="#ffb3a2" font-size="22">L</text>
              <text x="324" y="468" fill="#9ed4ff" font-size="22">H</text>
              <text x="78" y="596" fill="#ffb3a2" font-size="13" text-anchor="middle">赤道低压</text>
              <text x="310" y="596" fill="#9ed4ff" font-size="13" text-anchor="middle">副热带高压</text>
            </g>

            <g id="g-coriolis" data-step="2" opacity="1">
              <circle cx="1168" cy="168" r="34" fill="none" stroke="rgba(244,239,228,.4)" stroke-width="1.4"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ay)" marker-end="url(#ay)" d="M1168 196 C1168 168, 1168 150, 1194 144" stroke="#ffe08a" stroke-width="2.3"/>
              <text x="1110" y="118" fill="#ffe08a" font-size="14">北半球向右偏</text>
            </g>

            <g id="g-polar" data-step="3" opacity="1">
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ab)" marker-end="url(#ab)" d="M742 214 C760 320, 762 420, 742 490" stroke="#9ed4ff" stroke-width="3.3"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ab)" marker-end="url(#ab)" d="M732 510 C 670 526, 600 524, 548 500" stroke="#9ed4ff" stroke-width="3"/>
              <text x="590" y="448" fill="#9ed4ff" font-size="16">极地东风</text>
              <text x="764" y="468" fill="#9ed4ff" font-size="22">H</text>
              <text x="750" y="596" fill="#9ed4ff" font-size="13" text-anchor="middle">极地高压</text>
            </g>

            <g id="g-west" data-step="3" opacity="1">
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ag)" marker-end="url(#ag)" d="M318 510 C 390 526, 460 524, 512 500" stroke="#c6e7a0" stroke-width="3.1"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ar)" marker-end="url(#ar)" d="M530 492 C546 400, 542 290, 522 216" stroke="#ffb3a2" stroke-width="3.3"/>
              <text x="360" y="448" fill="#c6e7a0" font-size="16">盛行西风</text>
              <text x="544" y="468" fill="#ffb3a2" font-size="22">L</text>
              <text x="530" y="596" fill="#ffb3a2" font-size="13" text-anchor="middle">副极地低压</text>
            </g>

            <g id="g-cells" data-step="4" opacity="1">
              <path class="draw" fill="none" data-draw="1" data-marker="url(#aw)" marker-end="url(#aw)" d="M516 212 C 450 184, 380 186, 310 214" stroke="rgba(244,239,228,.82)" stroke-width="2.3" stroke-dasharray="6 5"/>
              <path class="draw" fill="none" data-draw="1" data-marker="url(#aw)" marker-end="url(#aw)" d="M540 210 C 610 182, 690 184, 728 208" stroke="rgba(244,239,228,.82)" stroke-width="2.3"/>
              <path d="M118 220 C 96 340, 104 450, 120 492 C 200 512, 260 508, 300 490 C 318 380, 310 270, 296 220 C 230 190, 160 192, 118 220 Z" fill="rgba(255,179,162,.14)"/>
              <path d="M308 222 C 322 340, 324 450, 316 492 C 400 514, 470 508, 516 490 C 534 370, 526 270, 516 218 C 440 186, 360 188, 308 222 Z" fill="rgba(198,231,160,.13)"/>
              <path d="M528 218 C 544 340, 546 450, 536 492 C 620 514, 700 508, 736 490 C 756 370, 750 270, 736 216 C 660 184, 580 186, 528 218 Z" fill="rgba(158,212,255,.14)"/>
              <text x="155" y="350" fill="#ffb3a2" font-size="15">低纬环流</text>
              <text x="155" y="370" fill="rgba(255,179,162,.8)" font-size="13">哈德莱 0–30°</text>
              <text x="355" y="350" fill="#c6e7a0" font-size="15">中纬环流</text>
              <text x="355" y="370" fill="rgba(198,231,160,.8)" font-size="13">费雷尔 30–60°</text>
              <text x="575" y="350" fill="#9ed4ff" font-size="15">高纬环流</text>
              <text x="575" y="370" fill="rgba(158,212,255,.85)" font-size="13">极地 60–90°</text>
            </g>

            <g id="g-cause" data-step="5" opacity="1">
              <text x="110" y="618" fill="#ffb3a2" font-size="13" text-anchor="middle">热力</text>
              <text x="310" y="618" fill="#ffe08a" font-size="13" text-anchor="middle">动力</text>
              <text x="530" y="618" fill="#ffe08a" font-size="13" text-anchor="middle">动力</text>
              <text x="750" y="618" fill="#9ed4ff" font-size="13" text-anchor="middle">热力</text>
            </g>

            <g id="g-front" data-step="6" opacity="1">
              <path class="draw" fill="none" data-draw="1" d="M500 500 C 540 420, 568 340, 596 250" stroke="#f4efe4" stroke-width="2.5"/>
              <g fill="#9ed4ff">
                <path d="M518 430 l12 0 l-6 -10 z"/>
                <path d="M540 378 l12 0 l-6 -10 z"/>
                <path d="M560 328 l12 0 l-6 -10 z"/>
              </g>
              <path d="M584 244 q12 -16 28 -4 q8 14 -4 18 q-16 6 -24 -4 z" fill="rgba(244,239,228,.78)"/>
              <path d="M608 238 q14 -14 26 -2 q7 12 -5 16 q-14 5 -21 -5 z" fill="rgba(244,239,228,.5)"/>
              <g stroke="#9ed4ff" stroke-width="1.3">
                <line x1="508" y1="512" x2="504" y2="528"/>
                <line x1="522" y1="514" x2="518" y2="532"/>
                <line x1="536" y1="512" x2="532" y2="526"/>
              </g>
              <text x="612" y="270" fill="#f4efe4" font-size="16">极锋</text>
            </g>

            <g id="g-jet" data-step="6" opacity="1">
              <path class="draw" fill="none" data-draw="1" data-marker="url(#ay)" marker-end="url(#ay)" d="M150 128 C 300 108, 470 118, 620 104 C 690 98, 740 112, 790 102" stroke="#ffe08a" stroke-width="5.5"/>
              <circle cx="310" cy="114" r="6" fill="none" stroke="#ffe08a" stroke-width="1.5"/>
              <circle cx="545" cy="108" r="6" fill="none" stroke="#ffe08a" stroke-width="1.5"/>
              <text x="250" y="96" fill="#ffe08a" font-size="13">副热带急流</text>
              <text x="500" y="88" fill="#ffe08a" font-size="13">极锋急流</text>
            </g>

            <g font-size="15">
              <g id="n0" data-step="0" fill="#ffe08a" opacity="1">
                <text x="850" y="250">板书</text>
                <text x="850" y="274" fill="#f4efe4" font-size="14">先画骨架，再长环流</text>
              </g>
              <g id="n1" data-step="1" fill="#f4efe4" opacity="1">
                <text x="850" y="308">热力环流三句</text>
                <text x="850" y="330" font-size="14" fill="rgba(244,239,228,.82)">受热上升，近地面变低压</text>
                <text x="850" y="350" font-size="14" fill="rgba(244,239,228,.82)">冷却下沉，近地面变高压</text>
                <text x="850" y="370" font-size="14" fill="rgba(244,239,228,.82)">水平：高压流向低压</text>
                <text x="850" y="392" font-size="14" fill="#ffe08a">不自转，就是单圈环流</text>
              </g>
              <g id="n2" data-step="2" fill="#f4efe4" opacity="1">
                <text x="850" y="424">加上自转</text>
                <text x="850" y="446" font-size="14" fill="rgba(244,239,228,.82)">北半球向右偏</text>
                <text x="850" y="466" font-size="14" fill="rgba(244,239,228,.82)">30°N 上空堆积下沉</text>
                <text x="850" y="486" font-size="14" fill="#9ed4ff">副高 = 动力原因</text>
              </g>
              <g id="n3" data-step="3" fill="#f4efe4" opacity="1">
                <text x="850" y="518">近地面三支风</text>
                <text x="850" y="540" font-size="14" fill="#ffb3a2">东北信风：副高流向赤道</text>
                <text x="850" y="560" font-size="14" fill="#c6e7a0">盛行西风：副高流向 60°</text>
                <text x="850" y="580" font-size="14" fill="#9ed4ff">极地东风：极高流向 60°</text>
              </g>
              <g id="n4" data-step="4" fill="#ffe08a" opacity="1">
                <text x="850" y="612" font-size="15">三个圈闭合</text>
                <text x="850" y="634" font-size="14" fill="rgba(244,239,228,.82)">低纬 · 中纬 · 高纬</text>
              </g>
              <g id="n5" data-step="5" fill="#ffe08a" opacity="1">
                <text x="850" y="664" font-size="15">口诀</text>
                <text x="850" y="686" font-size="14" fill="#f4efe4">赤道极地看冷热</text>
                <text x="850" y="706" font-size="14" fill="#f4efe4">副高副极看动力</text>
              </g>
              <g id="n6" data-step="6" fill="#ffe08a" opacity="1">
                <text x="1040" y="612" font-size="15">特殊情况</text>
                <text x="1040" y="634" font-size="14" fill="#f4efe4">极锋</text>
                <text x="1040" y="656" font-size="14" fill="#ffe08a">高空西风急流</text>
                <text x="1040" y="678" font-size="13" fill="rgba(244,239,228,.8)">对流层顶，自西向东</text>
              </g>
            </g>
          </svg>
