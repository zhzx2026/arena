name: fetch-lecture
on:
  push:
    branches:
      - arena/01a1075d-arena
    paths:
      - .github/workflows/fetch-lecture.yml
      - .github/fetch-lecture.trigger
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a1075d-arena
          fetch-depth: 1
      - name: Probe and download
        run: |
          set -u
          mkdir -p probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          PROXY='https://dl1.534532.xyz/res/dl?url=https%3A%2F%2Fv26-cold.douyinvod.com%2F37430db275efa70c6479aba19997f9e4%2F6ac11b6f%2Fvideo%2Ftos%2Fcn%2Ftos-cn-ve-15%2Fo8AQxFSaeYBRDGj77fqCi1B2AaEkBYzE1SNzIf%2F%3Fa%3D1128%26ch%3D0%26cr%3D0%26dr%3D0%26cd%3D0%257C0%257C0%257C0%26cv%3D1%26br%3D856%26bt%3D856%26cs%3D0%26ds%3D3%26ft%3DMgtpHQQqUYqfJEZPo0OW_QYaUqiXdpOY9VJEQzO9sbPD-Ipz%26mime_type%3Dvideo_mp4%26qs%3D0%26rc%3DNmRlaTU0ZzNlaTdmOjg5NUBpanQ5Z3U5cjlrNzMzNGkzM0BhMC8xYi00XzAxYmAtNF80YSNzZl8tMmRrY2xhLS1kLWFzcw%253D%253D%26btag%3D80010e000b7001%26cquery%3D100y_10sH%26dy_q%3D1791036195%26feature_id%3Dfea919893f650a8c49286568590446ef%26l%3D2026100322031548870A6C3B59E32932A7&hash=6015aa2fa79b795e0be905aaa706656f71419fcde324c132914e92911199272d&timestamp=1791036195880'
          DIRECT='https://v26.douyinvod.com/37430db275efa70c6479aba19997f9e4/6ac11b6f/video/tos/cn/tos-cn-ve-15/o8AQxFSaeYBRDGj77fqCi1B2AaEkBYzE1SNzIf/?a=1128&ch=0&cr=0&dr=0&cd=0%7C0%7C0%7C0&cv=1&br=856&bt=856&cs=0&ds=3&mime_type=video_mp4'
          ALT='https://f.666916.xyz/res/dl?url=https%3A%2F%2Fexample.com&hash=6015aa2fa79b795e0be905aaa706656f71419fcde324c132914e92911199272d&timestamp=1791036195880'
          probe() {
            local name="$1" url="$2"
            echo "===== $name ====="
            curl -sS -L --max-time 60 -A "$UA" -e 'https://www.douyin.com/' \
              -D "probe/${name}.headers" -o "probe/${name}.bin" -w "http_code=%{http_code} size=%{size_download} type=%{content_type} redir=%{num_redirects} url=%{url_effective}\n" \
              "$url" || echo "curl_fail=$?"
            echo "-- headers --"
            cat "probe/${name}.headers" || true
            echo "-- file --"
            file "probe/${name}.bin" || true
            echo "-- xxd --"
            xxd "probe/${name}.bin" | head -8 || true
            echo "-- text head --"
            python3 - << PY
          p="probe/${name}.bin"
          data=open(p,"rb").read(800)
          print(data[:800])
          PY
          }
          {
            probe proxy "$PROXY"
            probe direct "$DIRECT"
            probe alt "$ALT"
            probe home "https://dl1.534532.xyz/"
          } > probe/log.txt 2>&1 || true
          # publish a short summary as a workflow notice so we can read it via the API
          python3 - << 'PY'
          from pathlib import Path
          text = Path("probe/log.txt").read_text(errors="replace")
          # keep notices under annotation limits
          chunk = 3500
          for i in range(0, min(len(text), 14000), chunk):
              part = text[i:i+chunk]
              part = part.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
              print(f"::notice title=probe-{i}::{part}")
          print(f"::notice title=probe-len::bytes={len(text)}")
          PY
      - name: Commit probe
        run: |
          git config user.email "266473328+zhzx2026@users.noreply.github.com"
          git config user.name "zhzx2026"
          # don't commit huge binaries
          find probe -type f -size +200k -delete
          git add probe || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add lecture download probe logs"
          git push origin HEAD:arena/01a1075d-arena
